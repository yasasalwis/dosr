; PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html
;
; Mini Feeder - 4-channel dosing controller on a Seeed XIAO ESP32-C5.
;
; Nothing here is host-specific. Local tweaks (a shorter core_dir on Windows,
; a fixed upload_port, a different monitor speed) belong in an untracked
; platformio_override.ini - copy platformio_override.ini.example to start.

[platformio]
name         = mini-feeder
description  = Four-channel 12V dosing controller with OLED menu, web panel and MQTT
default_envs = seeed_xiao_esp32c5

; ---------------------------------------------------------------------------
; Shared by every environment.
; ---------------------------------------------------------------------------
[env]
; The pioarduino fork, not the official espressif32 platform. The Seeed
; platform (platform-seeedboards) v1.0.0 pins a GCC 8.4 toolchain against an
; IDF 5.5 framework and dies with
;   "unrecognized command line option -std=gnu++2b"
; "stable" tracks the latest pioarduino release; pin a version tag here if you
; need reproducible builds.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
; The XIAO exposes no DTR/RTS auto-reset wiring worth driving, and toggling
; them on open resets the board mid-log.
monitor_dtr = 0
monitor_rts = 0

upload_speed = 921600

build_unflags =
	-DBOARD_HAS_PSRAM

build_flags =
	; Arduino Serial goes over the USB-C port. Set this to 0 to move Serial to
	; UART0 TX (D6) instead - useful when USB will not enumerate, which is
	; exactly when you need the log. The ROM and second-stage bootloader always
	; log on UART0 TX regardless of this flag.
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=1
	; Home Assistant discovery payloads are larger than PubSubClient's 256-byte
	; default. mqtt.setBufferSize() raises it at runtime too; this keeps the
	; compile-time ceiling out of the way.
	-DMQTT_MAX_PACKET_SIZE=1024

lib_deps =
	adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
	adafruit/Adafruit GFX Library @ ^1.11.11
	adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2
	adafruit/Adafruit ADS1X15 @ ^2.5.0
	paulstoffregen/OneWire @ ^2.3.8
	milesburton/DallasTemperature @ ^3.11.0
	bblanchon/ArduinoJson @ ^7.2.0
	knolleary/PubSubClient @ ^2.8

; `pio check`
check_tool     = cppcheck
check_flags    = cppcheck: --enable=warning,style,performance --inline-suppr
check_skip_packages = yes
check_src_filters =
	+<src/>
	+<include/>

; ---------------------------------------------------------------------------
[env:seeed_xiao_esp32c5]
board = seeed_xiao_esp32c5
